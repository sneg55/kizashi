[project]
name = "kizashi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "strands-agents[openai]>=1.55.1",
  "strands-agents-tools>=0.8.8",
  "bedrock-agentcore>=1.23.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bedrock-agentcore-starter-toolkit>=0.3.12", "anthropic"]

[project.scripts]
kizashi = "kizashi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kizashi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
