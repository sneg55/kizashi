<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #f9f9fb;
    --sheet: #ffffff;
    --ink: #1f1f47;
    --ink-body: #171a1c;
    --muted: #575775;
    --fog: #6c7693;
    --rule: #eaedf6;
    --rule-strong: #d1d6e1;
    --accent: #576cdb;
    --accent-wash: #d6dbf5;
    --flag: #f25a5a;
    --flag-wash: #f7d4d4;
    --sans: Inter, "Helvetica Neue", Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --shadow: rgba(73, 46, 107, 0.14) 0px 3px 16px 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--ground); color: var(--ink-body); font-family: var(--sans);
         -webkit-font-smoothing: antialiased; }
  #stage { width: 1920px; height: 1080px; position: relative; }
  .pad { position: absolute; inset: 0; display: flex; flex-direction: column;
         justify-content: center; padding: 140px 170px; gap: 40px; }
  .mark { position: absolute; top: 62px; left: 170px; font-size: 34px; font-weight: 500;
          color: var(--ink); letter-spacing: -0.6px; }
  .mark span { border-bottom: 3px solid var(--accent); padding-bottom: 3px; }
  .foot { position: absolute; bottom: 60px; left: 170px; right: 170px;
          font-size: 23px; color: var(--fog); border-top: 1px solid var(--rule-strong);
          padding-top: 22px; }
  .brand { font-size: 122px; font-weight: 600; color: var(--ink); letter-spacing: -4px; line-height: 1; }
  .brand span { border-bottom: 8px solid var(--accent); padding-bottom: 8px; }
  .sub { font-size: 52px; font-weight: 400; color: var(--ink); line-height: 1.28; max-width: 1380px; letter-spacing: -1px; }
  .tag { font-size: 26px; color: var(--fog); letter-spacing: 0.5px; }
  .h { font-size: 26px; color: var(--fog); letter-spacing: 0.5px; }
  .bul { display: flex; flex-direction: column; gap: 22px; }
  .bul .row { background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow);
              display: grid; grid-template-columns: 74px 1fr; align-items: baseline;
              gap: 26px; font-size: 40px; padding: 34px 40px; line-height: 1.3; }
  .bul .mk { font-size: 26px; color: var(--accent); font-weight: 500; }
  .chain { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 20px; }
  .chain .cell { background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 28px; }
  .chain .lab { font-size: 24px; color: var(--fog); line-height: 1.3; min-height: 66px; }
  .chain .val { font-size: 40px; font-weight: 500; color: var(--ink); margin-top: 12px; letter-spacing: -0.5px; }
  .chain .cell.last .val { color: var(--flag); background: var(--flag-wash);
                           border-radius: 999px; padding: 6px 18px; display: inline-block; }
  .lede { font-size: 54px; font-weight: 400; color: var(--ink); line-height: 1.25; max-width: 1480px; letter-spacing: -1px; }
  .term { width: 100%; background: var(--sheet); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .term .tb { height: 54px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 11px; padding: 0 24px; }
  .term .tl { width: 13px; height: 13px; border-radius: 50%; background: var(--rule-strong); }
  .term .body { padding: 36px 42px; font-family: var(--mono); line-height: 1.62; }
  .term .pr { color: var(--accent); margin-bottom: 18px; }
  .term .pr::before { content: "$ "; color: var(--fog); }
  .ln { white-space: pre-wrap; padding-left: 2.4em; text-indent: -2.4em; }
  .ln.plain { color: var(--ink-body); }
  .ln.good { color: var(--accent); }
  .ln.dim { color: var(--muted); }
</style>
</head>
<body>
  <div id="stage"><div class="pad" id="pad"></div></div>
<script>
  const el = (c, txt) => { const e = document.createElement('div'); if (c) e.className = c; if (txt != null) e.textContent = txt; return e }
  const underlined = (c, txt) => { const e = el(c); const s = document.createElement('span'); s.textContent = txt; e.append(s); return e }
  const pad = document.getElementById('pad')
  const stage = document.getElementById('stage')

  function title(b) {
    pad.append(underlined('brand', b.brand))
    if (b.sub) pad.append(el('sub', b.sub))
    if (b.tag) pad.append(el('tag', b.tag))
  }
  function bullets(b) {
    if (b.title) pad.append(el('h', b.title))
    const wrap = el('bul')
    b.rows.forEach((r, i) => {
      const row = el('row')
      row.append(el('mk', String(i + 1).padStart(2, '0')), el(null, r))
      wrap.append(row)
    })
    pad.append(wrap)
  }
  function chain(b) {
    if (b.title) pad.append(el('h', b.title))
    if (b.lede) pad.append(el('lede', b.lede))
    const wrap = el('chain')
    b.rows.forEach((r, i) => {
      const cell = el('cell' + (i === b.rows.length - 1 ? ' last' : ''))
      const val = el('val')
      val.append(document.createTextNode(r.value))
      cell.append(el('lab', r.label), val)
      wrap.append(cell)
    })
    pad.append(wrap)
  }
  function term(b) {
    const t = el('term')
    const tb = el('tb')
    tb.append(el('tl'), el('tl'), el('tl'))
    const body = el('body')
    body.append(el('pr', b.prompt))
    const longest = b.lines.reduce((m, l) => Math.max(m, l.text.length), b.prompt.length + 2)
    const avail = 1920 - 340 - 84
    body.style.fontSize = Math.max(22, Math.min(30, Math.floor(avail / (longest * 0.602)))) + 'px'
    for (const l of b.lines) body.append(el('ln ' + (l.cls || 'plain'), l.text))
    t.append(tb, body)
    pad.append(t)
  }
  const R = { title, bullets, chain, term }

  window.__show = (scene) => {
    pad.innerHTML = ''
    stage.querySelectorAll('.mark, .foot').forEach((n) => n.remove())
    const b = scene.block
    if (!b || !R[b.type]) throw new Error('unknown block for scene ' + scene.id)
    R[b.type](b)
    if (b.type !== 'title') stage.append(underlined('mark', 'Kizashi'))
    if (scene.caption) stage.append(el('foot', scene.caption))
    return true
  }
</script>
</body>
</html>
